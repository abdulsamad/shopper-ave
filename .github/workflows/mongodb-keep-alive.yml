name: Keep MongoDB Atlas active

on:
  schedule:
    # Every three days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping MongoDB directly
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          test -n "$MONGODB_URI" || { echo "Missing MONGODB_URI secret"; exit 1; }
          npx --yes mongosh "$MONGODB_URI" \
            --quiet \
            --eval 'db.getSiblingDB("admin").runCommand({ ping: 1 })'
